<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crt receiver</title>
<style>
  /* Target: Chromecast Ultra, Chrome 90, viewport 1280x720 CSS px.
     The TV squeezes 16:9 into 4:3, so everything drawn over the video sits
     in a 75%-wide box stretched by 4/3 horizontally (.stretch).
     The page runs at 24-30 fps: nothing over the video is animated. */
  @font-face {
    font-family: "Bedstead";
    src: url("/receiver/bedstead.otf") format("opentype");
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    color: #f0f0f0;
  }
  video, #snow {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: fill;
  }
  /* Bottom to top: paused video, preview, snow, veil, teletext, calibration. */
  #main { z-index: 0; background: #000; }
  #preview { z-index: 1; }
  #snow { z-index: 2; image-rendering: pixelated; }
  #veil {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 3;
    background: #000; opacity: .7;
  }
  #screen {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 4;
    box-sizing: border-box;
  }
  #cal { z-index: 5; }
  .hidden { display: none !important; }
  #screen .box { position: relative; width: 100%; height: 100%; }
  #screen .stretch {
    width: 75%; height: 100%;
    transform: scaleX(1.3333); transform-origin: left top;
  }
  #ttx { font-family: "Bedstead", monospace; white-space: pre; }
  #ttx .tl { display: block; overflow: hidden; }
  body.night #veil { opacity: .9; }
  body.night #ttx .tl { visibility: hidden; }
  body.night #ttx .tl.head { visibility: visible; opacity: .35; }
</style>
</head>
<body>
<video id="main" playsinline></video>
<video id="preview" muted playsinline></video>
<canvas id="snow" width="160" height="90" class="hidden"></canvas>
<div id="veil" class="hidden"></div>
<div id="screen" class="hidden">
  <div class="box">
    <div class="stretch" id="stretch">
      <div id="ttx"></div>
    </div>
  </div>
</div>
<video id="cal" class="hidden" loop muted playsinline></video>
<script>
(function () {
  "use strict";
  var main = document.getElementById("main");
  var preview = document.getElementById("preview");
  var snow = document.getElementById("snow");
  var veil = document.getElementById("veil");
  var screenEl = document.getElementById("screen");
  var stretch = document.getElementById("stretch");
  var ttx = document.getElementById("ttx");
  var cal = document.getElementById("cal");
  var loadToken = 0;

  // ─── Reports to the daemon ─────────────────────────────────────

  function currentSrc() {
    return main.getAttribute("src") || null;
  }

  function report(event, extra) {
    var body = {
      event: event,
      position: main.currentTime || 0,
      duration: isFinite(main.duration) ? main.duration : 0,
      paused: main.paused,
      src: currentSrc(),
      error: null
    };
    if (extra) { for (var k in extra) { body[k] = extra[k]; } }
    try {
      fetch("/receiver/report", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      }).catch(function () {});
    } catch (e) { /* never let a report break the page */ }
  }

  // While a paused load is priming its frame (see primeFrame) the element
  // plays for a moment: those status reports would tell the daemon it is
  // playing, so they are skipped and one report follows the pause.
  var priming = null;

  ["playing", "pause", "seeked", "loadedmetadata"].forEach(function (ev) {
    main.addEventListener(ev, function () {
      if (priming === null) { report("status"); }
    });
  });
  main.addEventListener("ended", function () { report("ended"); });
  main.addEventListener("error", function () {
    var err = main.error ? ("media error " + main.error.code) : "media error";
    // media: true marks a file the element cannot play (the daemon pauses
    // with a notice); script and play() errors are only logged.
    if (currentSrc()) { report("error", { error: err, media: true }); }
  });
  window.onerror = function (message) {
    report("error", { error: String(message) });
  };
  setInterval(function () {
    if (currentSrc() && !main.paused && priming === null) { report("status"); }
  }, 1000);

  // ─── Teletext grid ─────────────────────────────────────────────

  var COLS = 40, ROWS = 18, PER_PAGE = 10, BAR_COLS = 14;
  var C = {
    white: "#f0f0f0", yellow: "#f0f000", cyan: "#00f0f0", green: "#00e000",
    magenta: "#f000f0", red: "#f00000", blue: "#2020ff", grey: "#a0a0a0", black: "#000"
  };
  var COMMAND_COLOURS = {
    resume: C.green, delete: C.red, stop: C.yellow, calibrate: C.cyan,
    loop: C.magenta, sync: C.blue, power: C.white
  };
  var ROW_COLOURS = { ready: C.white, done: C.grey, preparing: C.cyan, error: C.magenta };
  var DAYS = ["dom", "lun", "mar", "mer", "gio", "ven", "sab"];
  var MONTHS = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"];

  var view = null;  // the last screen view, null while the screen is hidden

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function fmt(t) {
    if (!isFinite(t) || t < 0) { t = 0; }
    t = Math.floor(t);
    var h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return (h > 0 ? h + ":" + pad2(m) : pad2(m)) + ":" + pad2(s);
  }

  // Lengths in code points, not UTF-16 units, so the grid stays aligned.
  function chars(s) { return Array.from(String(s)); }
  function len(s) { return chars(s).length; }
  function spaces(n) { var s = ""; for (var i = 0; i < n; i++) { s += " "; } return s; }
  function padR(s, n) {
    var c = chars(s);
    if (c.length > n) { return c.slice(0, Math.max(0, n - 1)).join("") + "…"; }
    return c.join("") + spaces(n - c.length);
  }
  function padL(s, n) { return spaces(n - len(s)) + s; }
  function repeat(ch, n) { var s = ""; for (var i = 0; i < n; i++) { s += ch; } return s; }

  function seg(text, fg, bg) { return { t: text, fg: fg || C.white, bg: bg || null }; }

  function headerDate() {
    var d = new Date();
    return DAYS[d.getDay()] + " " + pad2(d.getDate()) + " " + MONTHS[d.getMonth()] + " " +
      pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
  }

  function headerLine(v) {
    var sub = v.page + "/" + v.pages;
    var left = "P100 CRT QUEUE  " + sub;
    return [seg("P100", C.yellow), seg(" CRT QUEUE  "), seg(sub, C.yellow),
      seg(padL(headerDate(), COLS - len(left)))];
  }

  // "2026-11-08T20:10:00.123456+00:00" → local "21:10".
  function syncTime(iso) {
    if (!iso) { return null; }
    var d = new Date(String(iso).replace(/(\.\d{3})\d+/, "$1"));
    if (isNaN(d.getTime())) { return null; }
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }

  function playerLine(v) {
    if (v.paused_position !== null && v.paused_position !== undefined) {
      var dur = isFinite(main.duration) && main.duration > 0 ? main.duration : 0;
      var pos = v.paused_position;
      var filled = dur > 0 ? Math.max(0, Math.min(BAR_COLS, Math.round(BAR_COLS * pos / dur))) : 0;
      return [seg("▌▌ " + fmt(pos) + " / " + (dur > 0 ? fmt(dur) : "--:--") + "  " +
        repeat("▓", filled) + repeat("░", BAR_COLS - filled))];
    }
    return [seg(v.status || " ")];
  }

  function videoLine(r) {
    var head = r.symbol + " " + pad2(r.num) + " ";
    var text = head + padR(r.text, COLS - len(head) - 8) + " " + padL(r.right || "", 7);
    if (r.confirm) { return [seg(text, C.black, C.red)]; }
    if (r.selected) { return [seg(text, C.black, C.yellow)]; }
    return [seg(text, ROW_COLOURS[r.kind] || C.white)];
  }

  function commandLine(entries) {
    var segs = [];
    (entries || []).forEach(function (e, i) {
      if (i > 0) { segs.push(seg(" ")); }
      var col = COMMAND_COLOURS[e.key] || C.white;
      segs.push(e.selected ? seg(e.label, C.black, col) : seg(e.label, col));
    });
    return segs.length ? segs : [seg(" ")];
  }

  function bottomLine(v) {
    var help = v.help || "";
    var left;
    if (v.flash) {
      var col = v.flash_kind === "confirm" ? C.red : (v.flash_kind === "error" ? C.magenta : C.green);
      left = [seg(v.flash, col)];
      // The confirmation already says what OK does.
      if (v.flash_kind === "confirm") { help = ""; }
    } else {
      var at = syncTime(v.sync_at);
      left = v.sync_error ? [seg("Sync errore", C.magenta)] : [seg(at ? "Sync " + at : "Sync mai", C.green)];
      if (v.loop) { left.push(seg("  Loop attivo", C.green)); }
    }
    var used = 0;
    left.forEach(function (s) { used += len(s.t); });
    if (help && used + 1 + len(help) <= COLS) {
      left.push(seg(spaces(COLS - used - len(help)) + help, C.green));
    }
    return left;
  }

  function lines(v) {
    var L = [];
    L.push({ head: true, s: headerLine(v) });
    L.push({ s: [seg(repeat("▄", COLS), C.blue)] });
    var count = v.count + " video";
    L.push({ s: [seg("PLAYLIST" + padL(count, COLS - 8), C.cyan)] });
    L.push({ s: playerLine(v) });
    var rows = v.rows || [];
    for (var i = 0; i < PER_PAGE; i++) {
      L.push({ s: rows[i] ? videoLine(rows[i]) : [seg(" ")] });
    }
    L.push({ s: [seg(" ")] });
    var cmds = v.commands || [[], []];
    L.push({ s: commandLine(cmds[0]) });
    L.push({ s: commandLine(cmds[1]) });
    L.push({ s: bottomLine(v) });
    return L;
  }

  function lineNode(l) {
    var d = document.createElement("div");
    d.className = "tl" + (l.head ? " head" : "");
    l.s.forEach(function (s) {
      var sp = document.createElement("span");
      sp.textContent = s.t;
      sp.style.color = s.fg;
      if (s.bg) { sp.style.background = s.bg; }
      d.appendChild(sp);
    });
    return d;
  }

  var headNode = null;
  function renderGrid() {
    while (ttx.firstChild) { ttx.removeChild(ttx.firstChild); }
    headNode = null;
    lines(view).forEach(function (l) {
      var node = lineNode(l);
      if (l.head) { headNode = node; }
      ttx.appendChild(node);
    });
  }

  // The clock: only the header changes every second.
  setInterval(function () {
    if (view === null || headNode === null) { return; }
    var node = lineNode({ head: true, s: headerLine(view) });
    ttx.replaceChild(node, headNode);
    headNode = node;
  }, 1000);

  // Row 4 shows the duration the page learns from the paused video.
  main.addEventListener("durationchange", function () {
    if (view !== null && view.paused_position !== null && view.paused_position !== undefined) {
      renderGrid();
    }
  });

  // 40 columns fill the width, 18 rows fill the height of the box inside
  // the calibration margins (approved on the TV).
  function fitGrid() {
    var probe = document.createElement("span");
    probe.textContent = repeat("M", COLS);
    probe.style.fontSize = "100px";
    probe.style.fontFamily = "Bedstead, monospace";
    probe.style.whiteSpace = "pre";
    probe.style.position = "absolute";
    probe.style.visibility = "hidden";
    document.body.appendChild(probe);
    var w100 = probe.getBoundingClientRect().width;
    document.body.removeChild(probe);
    var width = stretch.clientWidth, height = stretch.clientHeight;
    if (!w100 || !width || !height) { return; }
    var lineH = height / ROWS;
    var font = Math.min(100 * width / w100, lineH);
    ttx.style.fontSize = font.toFixed(2) + "px";
    ttx.style.lineHeight = lineH.toFixed(2) + "px";
    var spare = width - w100 * font / 100;
    ttx.style.letterSpacing = Math.max(0, spare / COLS).toFixed(2) + "px";
  }
  if (document.fonts && document.fonts.load) {
    document.fonts.load("20px Bedstead").then(fitGrid, function () {});
  }
  window.addEventListener("resize", fitGrid);

  // Burn-in guard: the grid moves 3 px every 30 s (awake and at night).
  var DRIFT = [[0, 0], [3, 0], [3, 3], [0, 3]];
  var drift = 0;
  setInterval(function () {
    drift = (drift + 1) % DRIFT.length;
    stretch.style.transform = "translate(" + DRIFT[drift][0] + "px," + DRIFT[drift][1] + "px) scaleX(1.3333)";
  }, 30000);

  // ─── Snow ──────────────────────────────────────────────────────
  // The canvas is opaque: it also paints the black background over a
  // paused video when the highlighted row has nothing to show.

  var snowCtx = snow.getContext("2d");
  var snowImg = snowCtx.createImageData(160, 90);
  var snowTimer = null;

  function drawSnow() {
    var d = snowImg.data;
    for (var i = 0; i < d.length; i += 4) {
      var v = 40 + ((Math.random() * 121) | 0);
      d[i] = d[i + 1] = d[i + 2] = v;
      d[i + 3] = 255;
    }
    snowCtx.putImageData(snowImg, 0, 0);
  }

  // mode: "snow" | "black" | "off"
  function setSnow(mode) {
    if (mode !== "snow" && snowTimer !== null) {
      clearInterval(snowTimer);
      snowTimer = null;
    }
    if (mode === "off") {
      snow.classList.add("hidden");
      return;
    }
    if (mode === "black") {
      snowCtx.fillStyle = "#000";
      snowCtx.fillRect(0, 0, 160, 90);
    } else if (snowTimer === null) {
      drawSnow();
      snowTimer = setInterval(drawSnow, 83);
    }
    snow.classList.remove("hidden");
  }

  // ─── Preview ───────────────────────────────────────────────────
  // Always muted (the file has no audio track either). Unloaded, never just
  // hidden: a hidden <video> leaves its last frame on the video plane.

  var previewWindow = { start: 0, end: 20 };

  function muteAll() { preview.muted = true; preview.volume = 0; }
  muteAll();
  preview.addEventListener("volumechange", function () {
    if (!preview.muted || preview.volume !== 0) { muteAll(); }
  });

  function playPreview() {
    muteAll();
    var p = preview.play();
    if (p && p.catch) { p.catch(function () {}); }
  }

  function seekPreviewToStart() {
    try { preview.currentTime = previewWindow.start; } catch (e) { /* not seekable yet */ }
  }

  function previewOff() {
    preview.pause();
    if (preview.getAttribute("src")) {
      preview.removeAttribute("src");
      preview.load();
    }
  }

  // Redraws come at every percent of a download: the file is reloaded only
  // when its URL changes, and the loop restarts only when its window does.
  function showPreview(p) {
    var sameWindow = previewWindow.start === p.start && previewWindow.end === p.end;
    previewWindow = { start: p.start, end: p.end };
    if (preview.getAttribute("src") !== p.url) {
      muteAll();
      preview.setAttribute("src", p.url);
      var url = p.url;
      var onMeta = function () {
        preview.removeEventListener("loadedmetadata", onMeta);
        if (preview.getAttribute("src") !== url) { return; }
        seekPreviewToStart();
        playPreview();
      };
      preview.addEventListener("loadedmetadata", onMeta);
      preview.load();
      return;
    }
    if (preview.readyState < 1) { return; }  // its loadedmetadata will start it
    if (!sameWindow) { seekPreviewToStart(); }
    if (preview.paused) { playPreview(); }
  }

  preview.addEventListener("timeupdate", function () {
    if (!preview.getAttribute("src")) { return; }
    var t = preview.currentTime;
    if (t >= previewWindow.end || t < previewWindow.start - 1) { seekPreviewToStart(); }
  });
  preview.addEventListener("ended", function () {
    if (!preview.getAttribute("src")) { return; }
    seekPreviewToStart();
    playPreview();
  });

  // ─── Screen ────────────────────────────────────────────────────

  function applyBackground(v) {
    if (v.night) {
      previewOff();
      setSnow("off");
      return;
    }
    switch (v.background) {
      case "frame":
        previewOff();
        setSnow("off");
        break;
      case "preview":
        if (v.preview) {
          setSnow("off");
          showPreview(v.preview);
        } else {
          previewOff();
          setSnow("black");
        }
        break;
      case "snow":
        previewOff();
        setSnow("snow");
        break;
      default:  // "black"
        previewOff();
        setSnow("black");
        break;
    }
  }

  function showScreen(v) {
    if (v === null || v === undefined) {
      view = null;
      headNode = null;
      screenEl.classList.add("hidden");
      veil.classList.add("hidden");
      document.body.classList.remove("night");
      previewOff();
      setSnow("off");
      return;
    }
    var wasHidden = view === null;
    view = v;
    document.body.classList.toggle("night", !!v.night);
    applyBackground(v);
    renderGrid();
    veil.classList.remove("hidden");
    screenEl.classList.remove("hidden");
    if (wasHidden) { fitGrid(); }
  }

  // ─── Playback commands ─────────────────────────────────────────

  function applyMargins(m) {
    m = m || {};
    var top = (m.top || 0) * 1.25, bottom = (m.bottom || 0) * 1.25;
    var left = (m.left || 0) * 1.6667, right = (m.right || 0) * 1.6667;
    screenEl.style.padding =
      top + "px " + right + "px " + bottom + "px calc(1.5% + " + left + "px)";
    fitGrid();
  }

  function cancelPriming() {
    if (priming === null) { return; }
    clearTimeout(priming.timer);
    main.removeEventListener("playing", priming.onPlaying);
    priming = null;
    main.muted = false;
  }

  // A video loaded and paused at once may never draw its frame on the
  // Chromecast: play it muted for a moment, then pause and unmute.
  function primeFrame() {
    cancelPriming();
    var state = { timer: null, onPlaying: null };
    state.onPlaying = function () {
      main.removeEventListener("playing", state.onPlaying);
      state.timer = setTimeout(function () {
        if (priming !== state) { return; }
        // The "pause" event of this pause() fires after priming is cleared
        // and sends the one status report.
        priming = null;
        main.pause();
        main.muted = false;
      }, 250);
    };
    priming = state;
    main.muted = true;
    main.addEventListener("playing", state.onPlaying);
    var p = main.play();
    if (p && p.catch) {
      p.catch(function () {
        if (priming !== state) { return; }
        cancelPriming();
        main.pause();
        report("status");
      });
    }
  }

  function startAt(position, autoplay) {
    try { main.currentTime = position || 0; } catch (e) { /* not seekable yet */ }
    if (autoplay) {
      var p = main.play();
      if (p && p.catch) {
        p.catch(function (e) { report("error", { error: "play() failed: " + e }); });
      }
    } else {
      primeFrame();
    }
  }

  // While a load waits for its metadata, later play/pause/seek commands
  // update what it will do once the metadata arrives (a pause sent right
  // after a load must win over the load's own autoplay).
  var pending = null;

  function load(msg) {
    var token = ++loadToken;
    pending = null;
    cancelPriming();
    // Same file already loaded (e.g. the event stream reconnected): seek in
    // place instead of reloading, so the screen does not go black. A failed
    // element keeps its error until load(), so a retry reloads for real.
    if (currentSrc() === msg.url && main.readyState >= 1 && !main.error) {
      startAt(msg.position, msg.autoplay);
      return;
    }
    pending = { autoplay: msg.autoplay, position: msg.position };
    var onMeta = function () {
      main.removeEventListener("loadedmetadata", onMeta);
      if (token !== loadToken || pending === null) { return; }
      var want = pending;
      pending = null;
      startAt(want.position, want.autoplay);
    };
    main.addEventListener("loadedmetadata", onMeta);
    main.setAttribute("src", msg.url);
    main.load();
  }

  // Unload the main video and stop the calibration; the screen is left as
  // it is (the stopped screen follows in its own message).
  function blank() {
    loadToken++;
    pending = null;
    cancelPriming();
    main.pause();
    main.removeAttribute("src");
    main.load();
    stopCalibration();
  }

  function stopCalibration() {
    cal.pause();
    cal.removeAttribute("src");
    cal.load();
    cal.classList.add("hidden");
  }

  function calibration(url) {
    if (url === null || url === undefined) {
      stopCalibration();
      return;
    }
    cal.setAttribute("src", url);
    cal.classList.remove("hidden");
    cal.load();
    var p = cal.play();
    if (p && p.catch) { p.catch(function () {}); }
  }

  function dispatch(msg) {
    switch (msg.type) {
      case "config": applyMargins(msg.margins); break;
      case "load": load(msg); break;
      case "play":
        cancelPriming();
        if (pending !== null) { pending.autoplay = true; break; }
        var p = main.play();
        if (p && p.catch) { p.catch(function (e) { report("error", { error: "play() failed: " + e }); }); }
        break;
      case "pause":
        cancelPriming();
        if (pending !== null) { pending.autoplay = false; }
        main.pause();
        break;
      case "seek":
        if (pending !== null) { pending.position = msg.position; break; }
        try { main.currentTime = msg.position; } catch (e) { /* ignore */ }
        break;
      case "blank": blank(); break;
      case "screen": showScreen(msg.view); break;
      case "calibration": calibration(msg.url); break;
      default: break;
    }
  }

  // ─── Event stream from the daemon ──────────────────────────────

  var es = null;
  function connect() {
    es = new EventSource("/receiver/events");
    es.onopen = function () { report("hello"); };
    es.onmessage = function (e) {
      var msg;
      try { msg = JSON.parse(e.data); } catch (err) { return; }
      try { dispatch(msg); } catch (err) { report("error", { error: String(err) }); }
    };
    es.onerror = function () {
      // EventSource retries on its own unless the server answered with an
      // error status; in that case start over after a short wait.
      if (es.readyState === EventSource.CLOSED) {
        setTimeout(connect, 3000);
      }
    };
  }
  connect();
})();
</script>
</body>
</html>
